name: Live local model acceptance
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ollama:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[ollama]"
      - run: curl -fsSL https://ollama.com/install.sh | sh
      - name: Wait for local model server
        run: |
          if ! curl -fsS http://127.0.0.1:11434/api/tags >/dev/null 2>&1; then
            OLLAMA_HOST=127.0.0.1:11434 nohup ollama serve >"$RUNNER_TEMP/ollama.log" 2>&1 &
          fi
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - run: ollama pull qwen2.5:7b
      - run: python scripts/live_model.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-model-evidence
          path: live-model-report.json
