name: Live local model acceptance
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ollama:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[ollama]"
      - run: curl -fsSL https://ollama.com/install.sh | sh
      - run: ollama pull qwen2.5:3b
      - run: python scripts/live_model.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-model-evidence
          path: live-model-report.json
